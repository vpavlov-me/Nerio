name: branch-policy

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Defer required checks for draft pull requests
        if: github.event.pull_request.draft == true
        run: |
          echo "Full CI is deferred while the pull request is a draft. Mark it ready for review to run required checks." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate pull request direction
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-branch-policy.mjs
      - name: Require DCO sign-off on human commits
        if: >-
          ${{
            github.event.pull_request.head.repo.full_name != github.repository ||
            (
              (github.base_ref != 'main' || github.head_ref != 'dev') &&
              (github.base_ref != 'dev' || github.head_ref != 'main')
            )
          }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: node --test scripts/check-branch-policy.test.mjs scripts/check-dco.test.mjs
