name: pr-gate

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scopes:
    name: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.detect.outputs.docs }}
      ui: ${{ steps.detect.outputs.ui }}
      browser: ${{ steps.detect.outputs.browser }}
      visual: ${{ steps.detect.outputs.visual }}
      cli: ${{ steps.detect.outputs.cli }}
      mcp: ${{ steps.detect.outputs.mcp }}
      adapters: ${{ steps.detect.outputs.adapters }}
      packages: ${{ steps.detect.outputs.packages }}
      manual_audit: ${{ steps.detect.outputs.manual_audit }}
      workflow: ${{ steps.detect.outputs.workflow }}
      branch_policy: ${{ steps.detect.outputs.branch_policy }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      broad: ${{ steps.detect.outputs.broad }}
      unknown: ${{ steps.detect.outputs.unknown }}
      changed_count: ${{ steps.detect.outputs.changed_count }}
    steps:
      - name: Defer required checks for draft pull requests
        if: github.event.pull_request.draft == true
        run: |
          echo "Full CI is deferred while the pull request is a draft. Mark it ready for review to run required checks." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate pull request direction
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-branch-policy.mjs
      - name: Require DCO sign-off on human commits
        if: >-
          ${{
            github.event.pull_request.head.repo.full_name != github.repository ||
            (
              (github.base_ref != 'main' || github.head_ref != 'dev') &&
              (github.base_ref != 'dev' || github.head_ref != 'main')
            )
          }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Detect affected CI scopes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-ci-scopes.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Summarize selected scopes
        env:
          DOCS_ONLY: ${{ steps.detect.outputs.docs_only }}
          BROAD: ${{ steps.detect.outputs.broad }}
          UNKNOWN: ${{ steps.detect.outputs.unknown }}
        run: |
          {
            echo "## Scope decision"
            echo "- docs_only: \`$DOCS_ONLY\`"
            echo "- broad: \`$BROAD\`"
            echo "- unknown: \`$UNKNOWN\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: quality-and-contracts
    needs: scopes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm validate:repo-artifacts

      - name: Validate code and repository contracts
        if: needs.scopes.outputs.docs_only != 'true'
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:ci-scopes
          pnpm test:repo-artifacts
          pnpm test:branch-policy
          node --test scripts/check-dco.test.mjs scripts/validate-release-candidate.test.mjs

      - name: Validate Markdown-only documentation
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.docs_only == 'true'
          }}
        run: |
          pnpm validate:docs
          pnpm validate:onboarding

      - name: Validate public package contract
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.packages == 'true'
          }}
        run: |
          pnpm validate:package-output
          pnpm validate:package-budgets
          pnpm test:consumer:vite
          pnpm pack:check

      - name: Validate CLI contract
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.cli == 'true'
          }}
        run: pnpm test:cli

      - name: Validate MCP contract
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.mcp == 'true'
          }}
        run: pnpm test:mcp

      - name: Validate adapter contract
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.adapters == 'true'
          }}
        run: pnpm test:adapters

      - name: Validate manual release contract
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.manual_audit == 'true'
          }}
        run: |
          pnpm test:manual-audit-plan
          pnpm test:beta-feedback
          pnpm validate:stable-readiness

      - name: Validate workflow contract
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            (
              needs.scopes.outputs.workflow == 'true' ||
              needs.scopes.outputs.branch_policy == 'true'
            )
          }}
        run: node --test scripts/ci-workflow-contract.test.mjs

  product:
    name: product-contract
    needs: scopes
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        (
          (needs.scopes.outputs.docs == 'true' && needs.scopes.outputs.docs_only != 'true') ||
          needs.scopes.outputs.ui == 'true' ||
          needs.scopes.outputs.browser == 'true' ||
          needs.scopes.outputs.visual == 'true'
        )
      }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Validate documentation contract
        id: docs_contract
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.docs == 'true' &&
            needs.scopes.outputs.docs_only != 'true'
          }}
        run: |
          pnpm validate:docs
          pnpm validate:onboarding
          pnpm test:docs-examples
          pnpm build
          pnpm validate:route-budgets

      - name: Validate UI contract
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.ui == 'true'
          }}
        run: |
          pnpm test:ui
          pnpm test:a11y
          pnpm test:catalog
          pnpm test:api
          pnpm validate:api
          pnpm test:tokens
          pnpm test:onboarding
          pnpm validate:tokens
          pnpm validate:runtime-axes
          pnpm validate:typography
          pnpm validate:catalog

      - name: Require live maintainer approval for baseline changes
        id: visual_approval
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            needs.scopes.outputs.visual == 'true'
          }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- tests/visual/__screenshots__; then
            exit 0
          fi
          node --input-type=module -e '
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/issues/${process.env.PR_NUMBER}/labels`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) throw new Error(`Could not read current pull-request labels: ${response.status}`);
            const labels = await response.json();
            if (!labels.some(({ name }) => name === "visual-baseline-approved")) {
              throw new Error("Baseline changes require the visual-baseline-approved maintainer label. Apply it, then rerun failed jobs only.");
            }
          '

      - name: Install Chromium
        id: chromium
        if: >-
          ${{
            always() &&
            steps.install.outcome == 'success' &&
            (
              needs.scopes.outputs.browser == 'true' ||
              (
                needs.scopes.outputs.visual == 'true' &&
                steps.visual_approval.outcome == 'success'
              )
            )
          }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium PR smoke
        id: browser_smoke
        if: >-
          ${{
            always() &&
            steps.chromium.outcome == 'success' &&
            needs.scopes.outputs.browser == 'true'
          }}
        run: pnpm test:browser:pr

      - name: Run visual regression
        id: visual_regression
        if: >-
          ${{
            always() &&
            steps.chromium.outcome == 'success' &&
            steps.visual_approval.outcome == 'success' &&
            needs.scopes.outputs.visual == 'true'
          }}
        run: pnpm test:visual

      - name: Upload docs route bundle report
        if: ${{ always() && steps.docs_contract.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-route-bundle-report-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: artifacts/docs-route-bundle-report.json

      - name: Upload Chromium PR smoke artifacts
        if: ${{ always() && steps.browser_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-pr-smoke-artifacts-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/browser/results.json
            test-results/browser/artifacts/**

      - name: Upload visual regression artifacts
        if: ${{ always() && steps.visual_regression.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-artifacts-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/visual/**/*-actual.png
            test-results/visual/**/*-diff.png
            test-results/visual/**/trace.zip
            tests/visual/__screenshots__/linux/*.png

  pr_gate:
    name: PR gate
    if: ${{ github.event.pull_request.draft == false && always() }}
    needs:
      - scopes
      - quality
      - product
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require mandatory and selected development jobs
        env:
          SCOPES_RESULT: ${{ needs.scopes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PRODUCT_RESULT: ${{ needs.product.result }}
          PRODUCT_REQUIRED: >-
            ${{
              (needs.scopes.outputs.docs == 'true' && needs.scopes.outputs.docs_only != 'true') ||
              needs.scopes.outputs.ui == 'true' ||
              needs.scopes.outputs.browser == 'true' ||
              needs.scopes.outputs.visual == 'true'
            }}
        run: |
          if [[ "$SCOPES_RESULT" != "success" ]]; then
            echo "Branch policy or scope detection failed: scopes=$SCOPES_RESULT" >&2
            exit 1
          fi

          if [[ "$QUALITY_RESULT" != "success" ]]; then
            echo "Quality or scoped contract checks failed: quality=$QUALITY_RESULT" >&2
            exit 1
          fi

          if [[ "$PRODUCT_REQUIRED" == "true" && "$PRODUCT_RESULT" != "success" ]]; then
            echo "Selected product job ended with $PRODUCT_RESULT." >&2
            exit 1
          fi

          if [[ "$PRODUCT_REQUIRED" != "true" && "$PRODUCT_RESULT" != "success" && "$PRODUCT_RESULT" != "skipped" ]]; then
            echo "Unselected product job ended with $PRODUCT_RESULT." >&2
            exit 1
          fi
