name: pr-gate

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scopes:
    name: detect-scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.detect.outputs.docs }}
      ui: ${{ steps.detect.outputs.ui }}
      browser: ${{ steps.detect.outputs.browser }}
      visual: ${{ steps.detect.outputs.visual }}
      cli: ${{ steps.detect.outputs.cli }}
      mcp: ${{ steps.detect.outputs.mcp }}
      adapters: ${{ steps.detect.outputs.adapters }}
      packages: ${{ steps.detect.outputs.packages }}
      manual_audit: ${{ steps.detect.outputs.manual_audit }}
      workflow: ${{ steps.detect.outputs.workflow }}
      branch_policy: ${{ steps.detect.outputs.branch_policy }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      broad: ${{ steps.detect.outputs.broad }}
      unknown: ${{ steps.detect.outputs.unknown }}
      changed_count: ${{ steps.detect.outputs.changed_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect affected CI scopes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-ci-scopes.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Summarize selected scopes
        env:
          DOCS_ONLY: ${{ steps.detect.outputs.docs_only }}
          BROAD: ${{ steps.detect.outputs.broad }}
          UNKNOWN: ${{ steps.detect.outputs.unknown }}
          WORKFLOW: ${{ steps.detect.outputs.workflow }}
          BRANCH_POLICY: ${{ steps.detect.outputs.branch_policy }}
        run: |
          {
            echo "## Scope decision"
            echo "- docs_only: \`$DOCS_ONLY\`"
            echo "- broad: \`$BROAD\`"
            echo "- unknown: \`$UNKNOWN\`"
            echo "- workflow: \`$WORKFLOW\`"
            echo "- branch_policy: \`$BRANCH_POLICY\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: quality
    needs: scopes
    if: >-
      needs.scopes.result == 'success' &&
      (
        github.event.pull_request.draft == false ||
        needs.scopes.outputs.workflow == 'true' ||
        needs.scopes.outputs.branch_policy == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Run static and repository quality
        if: needs.scopes.outputs.docs_only != 'true'
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:ci-scopes
          pnpm test:repo-artifacts
          pnpm validate:repo-artifacts
          pnpm test:branch-policy
          node --test scripts/check-dco.test.mjs scripts/validate-release-candidate.test.mjs
      - name: Validate Markdown-only documentation
        if: needs.scopes.outputs.docs_only == 'true'
        run: |
          pnpm validate:docs
          pnpm validate:onboarding
          node scripts/validate-release-docs.mjs
      - name: Run documentation contracts
        if: needs.scopes.outputs.docs == 'true' && needs.scopes.outputs.docs_only != 'true'
        run: |
          pnpm validate:docs
          pnpm validate:onboarding
          pnpm test:docs-examples
          pnpm build
          pnpm validate:route-budgets
      - name: Run UI contracts
        if: needs.scopes.outputs.ui == 'true'
        run: |
          pnpm test:ui
          pnpm test:a11y
          pnpm test:catalog
          pnpm test:api
          pnpm validate:api
          pnpm test:tokens
          pnpm test:onboarding
          pnpm validate:tokens
          pnpm validate:runtime-axes
          pnpm validate:typography
          pnpm validate:catalog
      - name: Upload docs route bundle report
        if: failure() && needs.scopes.outputs.docs == 'true' && needs.scopes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-route-bundle-report-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: artifacts/docs-route-bundle-report.json

  browser:
    name: browser-and-visual
    needs: scopes
    if: >-
      needs.scopes.result == 'success' &&
      needs.scopes.outputs.docs_only != 'true' &&
      (
        github.event.pull_request.draft == false ||
        needs.scopes.outputs.workflow == 'true' ||
        needs.scopes.outputs.branch_policy == 'true'
      ) &&
      (
        needs.scopes.outputs.browser == 'true' ||
        needs.scopes.outputs.visual == 'true'
      )
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run selected browser and visual contracts
        env:
          RUN_BROWSER: ${{ needs.scopes.outputs.browser }}
          RUN_VISUAL: ${{ needs.scopes.outputs.visual }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          browser_status=0
          visual_status=0

          if [[ "$RUN_BROWSER" == "true" ]]; then
            pnpm test:browser:pr || browser_status=$?
          fi

          if [[ "$RUN_VISUAL" == "true" ]]; then
            if ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- tests/visual/__screenshots__; then
              node --input-type=module -e '
                const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/issues/${process.env.PR_NUMBER}/labels`, {
                  headers: {
                    Accept: "application/vnd.github+json",
                    Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                    "X-GitHub-Api-Version": "2022-11-28",
                  },
                });
                if (!response.ok) throw new Error(`Could not read current pull-request labels: ${response.status}`);
                const labels = await response.json();
                if (!labels.some(({ name }) => name === "visual-baseline-approved")) {
                  throw new Error("Baseline changes require the visual-baseline-approved maintainer label. Apply it, then rerun the failed browser-and-visual job.");
                }
              ' || visual_status=$?
            fi

            if [[ "$visual_status" -eq 0 ]]; then
              pnpm test:visual || visual_status=$?
            fi
          fi

          if [[ "$browser_status" -ne 0 || "$visual_status" -ne 0 ]]; then
            echo "Selected browser contracts failed: browser=$browser_status visual=$visual_status" >&2
            exit 1
          fi
      - name: Upload Chromium PR smoke artifacts
        if: failure() && needs.scopes.outputs.browser == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-pr-smoke-artifacts-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/browser/results.json
            test-results/browser/artifacts/**
      - name: Upload visual regression artifacts
        if: failure() && needs.scopes.outputs.visual == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-artifacts-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/visual/**/*-actual.png
            test-results/visual/**/*-diff.png
            test-results/visual/**/trace.zip
            tests/visual/__screenshots__/linux/*.png

  contracts:
    name: scoped-contracts
    needs: scopes
    if: >-
      needs.scopes.result == 'success' &&
      (
        github.event.pull_request.draft == false ||
        needs.scopes.outputs.workflow == 'true' ||
        needs.scopes.outputs.branch_policy == 'true'
      ) &&
      (
        needs.scopes.outputs.packages == 'true' ||
        needs.scopes.outputs.cli == 'true' ||
        needs.scopes.outputs.mcp == 'true' ||
        needs.scopes.outputs.adapters == 'true' ||
        needs.scopes.outputs.manual_audit == 'true' ||
        needs.scopes.outputs.workflow == 'true' ||
        needs.scopes.outputs.branch_policy == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run public package contract
        if: needs.scopes.outputs.packages == 'true'
        run: |
          pnpm validate:package-output
          pnpm validate:package-budgets
          pnpm test:consumer:vite
          pnpm pack:check
      - name: Run CLI contract
        if: needs.scopes.outputs.cli == 'true'
        run: pnpm test:cli
      - name: Run MCP contract
        if: needs.scopes.outputs.mcp == 'true'
        run: pnpm test:mcp
      - name: Run adapter contract
        if: needs.scopes.outputs.adapters == 'true'
        run: pnpm test:adapters
      - name: Run manual release contract
        if: needs.scopes.outputs.manual_audit == 'true'
        run: |
          pnpm test:manual-audit-plan
          pnpm test:beta-feedback
          pnpm validate:stable-readiness
      - name: Run workflow contract
        if: needs.scopes.outputs.workflow == 'true' || needs.scopes.outputs.branch_policy == 'true'
        run: node --test scripts/ci-workflow-contract.test.mjs scripts/check-branch-policy.test.mjs scripts/check-dco.test.mjs

  pr_gate:
    name: PR gate
    if: always()
    needs:
      - scopes
      - quality
      - browser
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require mandatory and selected development jobs
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          WORKFLOW_SCOPE: ${{ needs.scopes.outputs.workflow }}
          BRANCH_POLICY_SCOPE: ${{ needs.scopes.outputs.branch_policy }}
          SCOPES_RESULT: ${{ needs.scopes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          if [[ "$SCOPES_RESULT" != "success" ]]; then
            echo "Scope detection failed: scopes=$SCOPES_RESULT" >&2
            exit 1
          fi

          if [[ "$DRAFT" == "true" && "$WORKFLOW_SCOPE" != "true" && "$BRANCH_POLICY_SCOPE" != "true" ]]; then
            echo "Draft pull request: expensive CI jobs are deferred until ready for review."
            exit 0
          fi

          if [[ "$QUALITY_RESULT" != "success" ]]; then
            echo "Mandatory quality job failed: quality=$QUALITY_RESULT" >&2
            exit 1
          fi

          for result in "$BROWSER_RESULT" "$CONTRACTS_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A selected CI lane ended with $result." >&2
              exit 1
            fi
          done
