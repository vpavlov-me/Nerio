name: pr-gate

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scopes:
    name: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.detect.outputs.docs }}
      ui: ${{ steps.detect.outputs.ui }}
      browser: ${{ steps.detect.outputs.browser }}
      visual: ${{ steps.detect.outputs.visual }}
      cli: ${{ steps.detect.outputs.cli }}
      mcp: ${{ steps.detect.outputs.mcp }}
      adapters: ${{ steps.detect.outputs.adapters }}
      packages: ${{ steps.detect.outputs.packages }}
      manual_audit: ${{ steps.detect.outputs.manual_audit }}
      workflow: ${{ steps.detect.outputs.workflow }}
      branch_policy: ${{ steps.detect.outputs.branch_policy }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      broad: ${{ steps.detect.outputs.broad }}
      unknown: ${{ steps.detect.outputs.unknown }}
      changed_count: ${{ steps.detect.outputs.changed_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate pull request direction
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-branch-policy.mjs
      - name: Require DCO sign-off on human commits
        if: >-
          ${{
            github.event.pull_request.head.repo.full_name != github.repository ||
            (
              (github.base_ref != 'main' || github.head_ref != 'dev') &&
              (github.base_ref != 'dev' || github.head_ref != 'main')
            )
          }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: node --test scripts/check-branch-policy.test.mjs scripts/check-dco.test.mjs
      - name: Detect affected CI scopes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-ci-scopes.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Summarize selected scopes
        env:
          DOCS_ONLY: ${{ steps.detect.outputs.docs_only }}
          BROAD: ${{ steps.detect.outputs.broad }}
          UNKNOWN: ${{ steps.detect.outputs.unknown }}
        run: |
          {
            echo "## Scope decision"
            echo "- docs_only: \`$DOCS_ONLY\`"
            echo "- broad: \`$BROAD\`"
            echo "- unknown: \`$UNKNOWN\`"
          } >> "$GITHUB_STEP_SUMMARY"

  always_fast:
    name: always-fast
    needs: scopes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
        if: needs.scopes.outputs.docs_only != 'true'
      - run: pnpm typecheck
        if: needs.scopes.outputs.docs_only != 'true'
      - run: pnpm test:ci-scopes
      - run: pnpm test:repo-artifacts
      - run: pnpm validate:repo-artifacts
      - run: node --test scripts/validate-release-candidate.test.mjs
      - name: Validate Markdown-only documentation
        if: needs.scopes.outputs.docs_only == 'true'
        run: |
          pnpm validate:docs
          pnpm validate:onboarding

  docs:
    name: docs-contract
    needs: scopes
    if: github.event.pull_request.draft == false && needs.scopes.outputs.docs == 'true' && needs.scopes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:docs
      - run: pnpm validate:onboarding
      - run: pnpm test:docs-examples
      - run: pnpm build
      - run: pnpm validate:route-budgets
      - name: Upload docs route bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-route-bundle-report-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/docs-route-bundle-report.json

  ui:
    name: ui-contract
    needs: scopes
    if: github.event.pull_request.draft == false && needs.scopes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui
      - run: pnpm test:a11y
      - run: pnpm test:catalog
      - run: pnpm test:api
      - run: pnpm validate:api
      - run: pnpm test:tokens
      - run: pnpm test:onboarding
      - run: pnpm validate:tokens
      - run: pnpm validate:runtime-axes
      - run: pnpm validate:typography
      - run: pnpm validate:catalog
      - name: Install Chromium
        if: needs.scopes.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Chromium PR smoke
        if: needs.scopes.outputs.browser == 'true'
        run: pnpm test:browser:pr
      - name: Upload Chromium PR smoke artifacts
        if: failure() && needs.scopes.outputs.browser == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-pr-smoke-artifacts-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/browser/results.json
            test-results/browser/artifacts/**

  visual:
    name: visual-regression
    needs: scopes
    if: github.event.pull_request.draft == false && needs.scopes.outputs.visual == 'true'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require live maintainer approval for baseline changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- tests/visual/__screenshots__; then
            exit 0
          fi
          node --input-type=module -e '
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/issues/${process.env.PR_NUMBER}/labels`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) throw new Error(`Could not read current pull-request labels: ${response.status}`);
            const labels = await response.json();
            if (!labels.some(({ name }) => name === "visual-baseline-approved")) {
              throw new Error("Baseline changes require the visual-baseline-approved maintainer label. Apply it, then rerun failed jobs only.");
            }
          '
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-artifacts-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/visual/**/*-actual.png
            test-results/visual/**/*-diff.png
            test-results/visual/**/trace.zip
            tests/visual/__screenshots__/linux/*.png

  packages:
    name: public-package-contract
    needs: scopes
    if: github.event.pull_request.draft == false && needs.scopes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:package-output
      - run: pnpm validate:package-budgets
      - run: pnpm test:consumer:vite
      - run: pnpm pack:check

  cli:
    name: cli-contract
    needs: scopes
    if: github.event.pull_request.draft == false && needs.scopes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cli

  mcp:
    name: mcp-contract
    needs: scopes
    if: github.event.pull_request.draft == false && needs.scopes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mcp

  adapters:
    name: adapter-contract
    needs: scopes
    if: github.event.pull_request.draft == false && needs.scopes.outputs.adapters == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:adapters

  manual:
    name: manual-release-contract
    needs: scopes
    if: github.event.pull_request.draft == false && needs.scopes.outputs.manual_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:manual-audit-plan
      - run: pnpm test:beta-feedback
      - run: pnpm validate:stable-readiness

  workflow:
    name: workflow-contract
    needs: scopes
    if: github.event.pull_request.draft == false && (needs.scopes.outputs.workflow == 'true' || needs.scopes.outputs.branch_policy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/ci-workflow-contract.test.mjs scripts/check-branch-policy.test.mjs scripts/check-dco.test.mjs

  pr_gate:
    name: PR gate
    if: always()
    needs:
      - scopes
      - always_fast
      - docs
      - ui
      - visual
      - packages
      - cli
      - mcp
      - adapters
      - manual
      - workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require mandatory and selected development jobs
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          SCOPES_RESULT: ${{ needs.scopes.result }}
          ALWAYS_FAST_RESULT: ${{ needs.always_fast.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          UI_RESULT: ${{ needs.ui.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          ADAPTERS_RESULT: ${{ needs.adapters.result }}
          MANUAL_RESULT: ${{ needs.manual.result }}
          WORKFLOW_RESULT: ${{ needs.workflow.result }}
        run: |
          if [[ "$SCOPES_RESULT" != "success" ]]; then
            echo "Branch policy and scope detection failed: scopes=$SCOPES_RESULT" >&2
            exit 1
          fi

          if [[ "$IS_DRAFT" == "true" ]]; then
            for result in \
              "$ALWAYS_FAST_RESULT" \
              "$DOCS_RESULT" \
              "$UI_RESULT" \
              "$VISUAL_RESULT" \
              "$PACKAGES_RESULT" \
              "$CLI_RESULT" \
              "$MCP_RESULT" \
              "$ADAPTERS_RESULT" \
              "$MANUAL_RESULT" \
              "$WORKFLOW_RESULT"; do
              if [[ "$result" != "success" && "$result" != "skipped" ]]; then
                echo "A draft-only job ended with $result." >&2
                exit 1
              fi
            done
            echo "Draft pull request: expensive checks are deferred until ready for review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$ALWAYS_FAST_RESULT" != "success" ]]; then
            echo "Mandatory development checks failed: always-fast=$ALWAYS_FAST_RESULT" >&2
            exit 1
          fi
          for result in \
            "$DOCS_RESULT" \
            "$UI_RESULT" \
            "$VISUAL_RESULT" \
            "$PACKAGES_RESULT" \
            "$CLI_RESULT" \
            "$MCP_RESULT" \
            "$ADAPTERS_RESULT" \
            "$MANUAL_RESULT" \
            "$WORKFLOW_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A selected scope job ended with $result." >&2
              exit 1
            fi
          done
